<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazone Clone</title>
  <link rel="stylesheet" href="Amazone.css">
  <!-- Font awesome link -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  </head>
<body>
  <header>
    <div class="navbar">
      <div class="logo">
        <img src="assests/amazon_logo.png" alt="">
      </div>
      <!-- location -->
      <div class="location">
        <p>Deliver to</p>
        <i class="fa-solid fa-location-dot"><a href="">India</a></i>
      </div>
      <!-- Input Section -->
       <div class="input-section">
        <select name="" id="">
          <option value="">All</option>
        </select>
        <input type="text" placeholder="Serach amazone">
        <i class="fa-solid fa-magnifying-glass"></i>
       </div>

       <!-- sign in -->
        <div class="sign-in-section">
          <p>Hello sign in</p>
          <select name="" id="">
            <option value="">Account & List</option>
          </select>
        </div>
        
      </div>
  </header>
</body>
</html>
